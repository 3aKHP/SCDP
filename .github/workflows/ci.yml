name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
